[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nenyax"
version = "0.1.0a1"
description = "One contract for every RL environment: load any format, drive it with any policy, get a judged trajectory."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Iacon Autonomics" }]
keywords = ["reinforcement-learning", "rl-environments", "openenv", "llm", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
gymnasium = ["gymnasium>=1.0,<2"]
reasoning-gym = ["reasoning-gym>=0.1.20,<0.2"]
verifiers = ["verifiers>=0.3,<0.4"]
harbor = ["harbor>=0.23,<0.24"]
openenv = ["openenv>=0.6,<0.7"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
mlflow = ["mlflow>=2.14"]
wandb = ["wandb>=0.17"]
export = ["datasets>=2.19"]
train = ["torch>=2.4", "transformers>=4.45,<6"]
tinker = ["tinker>=0.31,<0.32"]
all = ["nenyax[gymnasium,reasoning-gym,verifiers,harbor,openenv,otel,mlflow,wandb,export,train,tinker]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nenyax = "nenyax.cli:main"

# Third-party drivers register here, e.g.:
# [project.entry-points."nenyax.drivers"]
# mydriver = "my_pkg.nenyax_driver:MyDriver"

[tool.hatch.build.targets.wheel]
packages = ["src/nenyax"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: exercises a real third-party environment package",
  "docker: requires a running Docker daemon",
]
