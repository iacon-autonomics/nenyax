name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e '.[dev,gymnasium,reasoning-gym,openenv,verifiers,harbor]'
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools
      - run: uv run pytest -q

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e .
      - run: uv run python tools/validate_registry.py --install

  scaffold:
    # every `nenyax new-plugin` kind must produce a package that passes its own conformance test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kind: [driver, sandbox, learner, judge, hub, telemetry]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e '.[dev]'
      - run: uv run nenyax new-plugin ${{ matrix.kind }} demo --dest /tmp/p
      - run: uv pip install -e /tmp/p/nenyax-demo && uv run pytest -q /tmp/p/nenyax-demo
